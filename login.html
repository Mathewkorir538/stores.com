<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shopit</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    <div id="top-section">
        <div class="header-container">
            <div class="logo-container">
                <img src="./images/auto-parts-car-service-logo-template-vector-54324256.jpg" alt="Shopit Logo" class="logo">
                <h1>Shopit</h1>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="help.html">Help</a>
                <a href="cart.html">Cart</a>
                <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

 
    <div id="login-section">
        <h2>Sign In to Your Account</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" id="login-btn">Sign In</button>
        </form>
        <p>Don't have an account? <a href="register.html">Register here</a>.</p>
    </div>

    
    <footer>
        <div class="footer-container">
            <div class="footer-section">
                <h3>About Shopit</h3>
                <p>&copy; 2025 Shopit. All rights reserved.</p>
                <p>Your one-stop shop for all your needs!</p>
            </div>
            <div class="footer-section">
                <h3>Contact Us</h3>
                <form action="#" method="post">
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <textarea name="message" placeholder="Your Message" rows="4" required></textarea>
                    <button type="submit">Submit</button>
                </form>
            </div>
            <div class="footer-section">
                <h3>Follow Us</h3>
                <div class="social-media">
                    <a href="#" target="_blank"><img src="./images/FECEBOOK LOGO.avif" alt="Facebook"></a>
                    <a href="#" target="_blank"><img src="./images/free-twitter-logo-icon-2429-thumb.png" alt="Twitter"></a>
                    <a href="#" target="_blank"><img src="./images/INSTAGRAM LOGO.jpg" alt="Instagram"></a>
                </div>
            </div>
            <div class="footer-section">
                <h3>Our Partners</h3>
                <div class="partners">
                    <img src="./images/kcb-group-vector-logo.png" alt="Partner 1">
                    <img src="./images/COKE LOGO.jpg" alt="Partner 2">
                </div>
            </div>
        </div>
    </footer>

    <script src="login.js"></script>
</body>
</html>
